# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

# Get a runner from "empty" to "this repo is checked out and its dependencies
# are installed", ready to run one `vortex:<concern>:all` target.
#
# It exists because `repo-verify.yml` runs one job per concern and every one of
# those jobs needs the identical preamble first. Written out per job that is four
# copies of it, which is four places to forget to change.
#
# Nothing here is specific to verification. Any shared workflow that needs a
# platform repo prepared can use it, which is why it is named for the repo
# rather than for the workflow that happens to be its first caller.
#
# The toolchain comes from the repo, never from here: Node from `.nvmrc`, pnpm
# from `packageManager`. A version pinned in this file would be a second opinion
# about something the repo has already stated.
#
# NO AWS SESSION, deliberately — see repo-verify.yml. A composite action every
# repo runs is the wrong place to hold a role.

name: Setup vortex repo
description: Check out a platform repo and install its dependencies, ready to run a vortex:*:all target.

inputs:
  node-version:
    description: "Node version. Defaults to the repo's .nvmrc."
    required: false
    default: ""
  submodules:
    description: "Passed to actions/checkout: 'recursive', 'true' or 'false'."
    required: false
    default: "recursive"
  ssh-key:
    description: >-
      Deploy/SSH key with read access to any private submodules. Required only
      when the repo has submodules — .gitmodules on this platform uses SSH URLs,
      which the default workflow token cannot satisfy.
    required: false
    default: ""
  npm-token:
    description: >-
      npm token with read access to the @teamvortexsoftware scope. Required when
      the repo installs a package from it, and whenever the vortex CLI has to be
      fetched — which happens automatically for a repo that does not carry it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: ${{ inputs.submodules }}
        ssh-key: ${{ inputs.ssh-key }}

    - name: Setup pnpm
      # Before setup-node, which needs pnpm on PATH to resolve its cache.
      # Version comes from the repo's own package.json "packageManager".
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        run_install: false

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        # When node-version is empty, setup-node falls back to the file. The
        # default profile requires .nvmrc, so the fallback always has a target.
        node-version: ${{ inputs.node-version }}
        node-version-file: ".nvmrc"
        cache: pnpm

    - name: Configure npm auth
      # User-level, never the repo's committed .npmrc: pnpm refuses to expand
      # ${NPM_TOKEN} from a project .npmrc, and every repo's .npmrc says so.
      # The token is read from env rather than interpolated into the script.
      if: ${{ inputs.npm-token != '' }}
      shell: bash
      env:
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Does the repo supply the vortex CLI?
      id: repo-cli
      shell: bash
      # Whether a repo depends on config-utility is the repo's own business, so
      # this asks rather than requires. `pnpm install` links a dependency's
      # binary into node_modules/.bin, and that is also where a `vortex:*` target
      # finds it, since pnpm puts that directory on PATH when it runs a script.
      # So the presence of the link is exactly the question worth asking.
      run: |
        if [ -x node_modules/.bin/vortex ]; then
          echo "supplied=true" >> "$GITHUB_OUTPUT"
          echo "the repo supplies the vortex CLI; not installing one"
        else
          echo "supplied=false" >> "$GITHUB_OUTPUT"
          echo "the repo does not supply the vortex CLI; installing it globally"
        fi

    - name: Setup vortex CLI
      # Installed when the repo does not carry it, rather than when a caller
      # remembers to ask. The platform's standard actions supply the CLI so that
      # a target may shell out to a bare `vortex` without every repo having to
      # take a dependency on it.
      #
      # Skipped without a token, because the install cannot succeed and failing
      # here would fail every job in a repo that may not want the CLI at all. A
      # target that then needs `vortex` fails on its own, saying so.
      if: ${{ steps.repo-cli.outputs.supplied == 'false' && inputs.npm-token != '' }}
      uses: TeamVortexSoftware/platform-actions/actions/setup-vortex-cli@main
      with:
        npm-token: ${{ inputs.npm-token }}
