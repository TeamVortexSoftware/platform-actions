# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Standard pull-request verification for any repo on the platform.
#
# A consuming repo calls this from a short stub in its own
# .github/workflows/vtx-repo-verify.yml; all the logic lives here, so changing
# what verification means touches this file and no consuming repo. The stub to
# install, and what each target has to satisfy, are in:
#   platform-actions/docs/standard-repo-workflows.md
#
# ONE JOB PER CONCERN, running concurrently:
#
#   lint      vortex:lint:all
#   test      vortex:test:all
#   generate  vortex:generate:all
#   build     vortex:build:all
#
# ONE SETTING PER JOB, named for it: skip-lint, skip-test, skip-generate,
# skip-build. Same direction every time — true means the job does not run. Three
# default to false and `skip-build` defaults to true, because build is the one
# job most repos do not want; the odd one out is the default, never the name.
#
# They are separate jobs rather than four steps of one so that a single run
# reports everything that is wrong. Sequentially, a lint failure ends the run
# and nobody learns whether the tests pass — you fix lint, push, and discover
# the next failure a run later. Separate jobs also mean separate check names,
# which is what a branch-protection rule can key off.
#
# A DIRTY TREE FAILS THE JOB — every job, not just generate. Each one runs its
# target and then asserts the working tree is unchanged, via the
# assert-clean-tree action, with a message saying what a dirty tree means for
# that concern. `lint` and `test` were always required to be read-only; this is
# the first time it is enforced rather than documented.
#
# That uniformity is what lets `build` run alongside the others. It used to run
# last, deliberately, so its uncommitted output could not be mistaken for
# generate's drift — with one job per concern that confusion is structurally
# impossible, since each job is its own runner with its own checkout. So build
# is held to the same rule and finally gives an honest message when dist/ is not
# ignored.
#
# Every target is invoked with `pnpm run --if-present`, which exits 0 when the
# script is undefined. The default repo profile ships every vortex:<concern>:all
# as a runnable `echo` placeholder for the repo's keeper to fill in, so the
# targets are expected to exist; --if-present is the safety net, not the design.
#
# The vortex CLI is supplied automatically. A target may shell out to a bare
# `vortex` — vortex:generate:all in the infra repos does — and setup-vortex-repo
# installs the CLI when the repo does not carry it as a dependency. There is no
# setting for it: a caller had to remember to ask before, and forgetting produced
# a failure with nothing to point at.
#
# No AWS credentials are configured here, by design. If a repo's target needs
# the vault, that is for the repo to solve inside its own target — a shared
# workflow every repo calls is the wrong place to hold a role.

name: repo-verify

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version. Defaults to the repo's .nvmrc."
        type: string
        required: false
      submodules:
        description: "Passed to actions/checkout: 'recursive', 'true' or 'false'."
        type: string
        required: false
        default: "recursive"
      skip-lint:
        description: "Skip the lint job, which runs vortex:lint:all."
        type: boolean
        required: false
        default: false
      skip-test:
        description: "Skip the test job, which runs vortex:test:all."
        type: boolean
        required: false
        default: false
      skip-generate:
        description: >-
          Skip the generate job, which runs vortex:generate:all. For a repo
          adopting the workflow before its generators are honest — not a
          permanent state.
        type: boolean
        required: false
        default: false
      skip-build:
        description: >-
          Skip the build job, which runs vortex:build:all. Skipped by default:
          worth running where a PR should prove the artifact still builds, noise
          where nothing is built. This is the one job most repos do not want.
        type: boolean
        required: false
        default: true
    secrets:
      ssh-key:
        description: >-
          Deploy/SSH key with read access to any private submodules. Required
          only when the repo has submodules — .gitmodules on this platform uses
          SSH URLs, which the default token cannot satisfy.
        required: false
      npm-token:
        description: >-
          npm token with read access to the @teamvortexsoftware scope. Required
          only when the repo installs a package from it.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    if: ${{ !inputs.skip-lint }}
    runs-on: ubuntu-latest
    steps:
      # Referenced by owner/repo/path@ref rather than ./actions/… — a relative
      # `uses:` inside a reusable workflow resolves against the CALLER's
      # checkout, not this repository's, so the local form would not exist.
      - uses: TeamVortexSoftware/platform-actions/actions/setup-vortex-repo@main
        with:
          node-version: ${{ inputs.node-version }}
          submodules: ${{ inputs.submodules }}
          ssh-key: ${{ secrets.ssh-key }}
          npm-token: ${{ secrets.npm-token }}

      - name: vortex:lint:all
        run: pnpm run --if-present vortex:lint:all

      - uses: TeamVortexSoftware/platform-actions/actions/assert-clean-tree@main
        with:
          message: >-
            vortex:lint:all modified the tree. lint is a read-only concern —
            put mutating fixes in vortex:lint:fix instead.

  test:
    if: ${{ !inputs.skip-test }}
    runs-on: ubuntu-latest
    steps:
      - uses: TeamVortexSoftware/platform-actions/actions/setup-vortex-repo@main
        with:
          node-version: ${{ inputs.node-version }}
          submodules: ${{ inputs.submodules }}
          ssh-key: ${{ secrets.ssh-key }}
          npm-token: ${{ secrets.npm-token }}

      - name: vortex:test:all
        run: pnpm run --if-present vortex:test:all

      - uses: TeamVortexSoftware/platform-actions/actions/assert-clean-tree@main
        with:
          message: >-
            vortex:test:all wrote into the repo. The test battery must leave no
            trace — write to a temp dir, or gitignore the output.

  generate:
    if: ${{ !inputs.skip-generate }}
    runs-on: ubuntu-latest
    steps:
      - uses: TeamVortexSoftware/platform-actions/actions/setup-vortex-repo@main
        with:
          node-version: ${{ inputs.node-version }}
          submodules: ${{ inputs.submodules }}
          ssh-key: ${{ secrets.ssh-key }}
          npm-token: ${{ secrets.npm-token }}

      - name: vortex:generate:all
        run: pnpm run --if-present vortex:generate:all

      - uses: TeamVortexSoftware/platform-actions/actions/assert-clean-tree@main
        with:
          message: >-
            vortex:generate:all changed files — a source was edited without
            regenerating. Run it locally and commit the result.

  build:
    if: ${{ !inputs.skip-build }}
    runs-on: ubuntu-latest
    steps:
      - uses: TeamVortexSoftware/platform-actions/actions/setup-vortex-repo@main
        with:
          node-version: ${{ inputs.node-version }}
          submodules: ${{ inputs.submodules }}
          ssh-key: ${{ secrets.ssh-key }}
          npm-token: ${{ secrets.npm-token }}

      - name: vortex:build:all
        run: pnpm run --if-present vortex:build:all

      - uses: TeamVortexSoftware/platform-actions/actions/assert-clean-tree@main
        with:
          message: >-
            vortex:build:all left files in the tree. Build output is never
            committed — add it to .gitignore.
