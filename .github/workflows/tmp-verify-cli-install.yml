# TEMPORARY — delete before this branch merges.
#
# Proves that setup-vortex-cli can actually install the CLI globally. It could
# not: the published package's preinstall is `npx only-allow pnpm`, so
# `npm install -g` exited 254 and every job using it failed.
#
# It runs here rather than from a consuming repo because a consuming stub pins
# `@main`, so the fix cannot be exercised until it is already merged — which is
# how the broken version reached main in the first place. A workflow inside
# platform-actions can reference the action by relative path on its own branch.

name: tmp-verify-cli-install

on:
  push:
    branches: [feature/ops-844]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Confirm the CLI is absent to begin with
        run: |
          if command -v vortex >/dev/null 2>&1; then
            echo "::error::vortex is already on PATH, so this proves nothing." >&2
            exit 1
          fi
          echo "vortex is not on PATH, as expected"

      - name: Setup vortex CLI
        uses: ./actions/setup-vortex-cli
        with:
          npm-token: ${{ secrets.NPM_READ_TOKEN }}

      - name: It is on PATH and it runs
        run: |
          command -v vortex
          vortex --version --no-check
          vortex repo --help

      - name: Which version did it actually get?
        run: |
          echo "registry latest: $(npm view @teamvortexsoftware/config-utility dist-tags.latest)"
          echo "installed:       $(vortex --version --no-check | head -1)"
