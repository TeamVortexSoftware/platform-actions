# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Requests an apply of every infra-data root with a machine that boots from a
# built machine image, so each apply boots the image's newest usable copy. This
# workflow never touches AWS or an image; the root's apply picks the copy.
#
# A root has such a machine when one of its operator/vm modules names a VM
# profile file (`vm_profile_file = "<path>"`) whose `aws.image` is a built image: set, and
# not one of the stock images in infra-as-code's data/providers/aws.yml - the
# same test the image lookup (modules/data/aws/amis) makes.
#
# For each such root it writes job-apply-images.json into the root, on a branch
# named after it (state-groups/<group>/<root>), and opens a PR - the same request
# job-renew-certs makes. The infra-data repo's own apply workflow takes it from
# there: it applies the root, commits its run-files and merges.
#
# Called from the vtx-job-apply-images stub; see
#   platform-actions/docs/workflows/job-apply-images.md
#
# This repository is PUBLIC, so the bot identity comes in as an input from the
# caller rather than being written here.

name: job-apply-images

on:
  workflow_call:
    inputs:
      bot-user:
        description: "GitHub user the request commits are authored as."
        type: string
        required: true
    secrets:
      ssh-key:
        description: "SSH key that can clone the repo with its submodules and push branches to it."
        required: true
      bot-token:
        description: "Bot PAT that can open a PR on the repo. A GITHUB_TOKEN will not do: a PR it opens does not start the apply workflow."
        required: true

permissions:
  contents: read

jobs:
  apply-images:
    runs-on: ubuntu-latest

    env:
      JOB_NAME: job-apply-images
      BOT_USER: ${{ inputs.bot-user }}

    steps:
      - name: Checkout the infra-data repo
        uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.ssh-key }}

      - name: Find roots with a machine booting a built image
        id: find
        run: |
          stock=$(yq '.stock_images | keys | .[]' infra-as-code/data/providers/aws.yml)
          if [[ -z "$stock" ]]; then
            echo "::error::No stock images in infra-as-code/data/providers/aws.yml; cannot tell built images from stock ones."
            exit 1
          fi

          roots=()
          for root in state-groups/*/*; do
            [[ -d "$root" ]] || continue
            # The VM profile files of the root's operator/vm modules: those boot
            # the machines. (access/vm takes the same file but boots nothing.)
            vms=$(awk '
              /^module /                            { source = "" }
              /^[[:space:]]*source[[:space:]]*=/    { source = $0 }
              /^[[:space:]]*vm_profile_file[[:space:]]*=/ && source ~ /modules\/operator\/vm"/ {
                match($0, /"[^"]*"/); print substr($0, RSTART + 1, RLENGTH - 2)
              }' "$root"/*.tf 2>/dev/null || true)
            for vm in $vms; do
              file=$(realpath -m "$root/$vm")
              [[ -f "$file" ]] || continue
              image=$(yq '.aws.image // ""' "$file")
              if [[ -n "$image" ]] && ! grep -qxF "$image" <<<"$stock"; then
                echo "$root: ${file#"$PWD/"} boots $image."
                roots+=("$root")
                break
              fi
            done
          done

          echo "roots=${roots[*]}" >> "$GITHUB_OUTPUT"
          [[ ${#roots[@]} -eq 0 ]] && echo "No root has a machine booting a built image."
          exit 0

      - name: Request an apply of each root
        if: steps.find.outputs.roots != ''
        env:
          ROOTS: ${{ steps.find.outputs.roots }}
          GH_TOKEN: ${{ secrets.bot-token }}
        run: |
          base=$(git branch --show-current)
          git config user.name "$BOT_USER"
          git config user.email "$BOT_USER@users.noreply.github.com"
          actions_log="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          stuck=()
          for root in $ROOTS; do
            # The branch is the apply request. If it already exists, an apply of
            # this root is in flight or stuck: leave it, and carry on with the rest.
            if git ls-remote --exit-code --heads origin "$root" > /dev/null; then
              echo "::error::Branch $root already exists in $GITHUB_REPOSITORY. An apply of this root is already in progress or stuck."
              stuck+=("$root")
              continue
            fi

            git checkout -q "$base"
            git checkout -q -b "$root"
            # The commit the job was looking at, and the job's log. The log makes
            # every request a change, even from an unchanged commit.
            jq -n --arg sha "$GITHUB_SHA" --arg actions_log "$actions_log" \
              '{sha: $sha, actions_log: $actions_log}' > "$root/$JOB_NAME.json"
            git add "$root/$JOB_NAME.json"
            git commit -q -m "$JOB_NAME: request an apply of $root"
            git push -q origin "$root"

            gh pr create --repo "$GITHUB_REPOSITORY" --base "$base" --head "$root" \
              --title "Apply root module ${root#state-groups/}" \
              --body "Requested by $JOB_NAME ($actions_log): a machine in this root boots a built machine image."
          done

          if [[ ${#stuck[@]} -gt 0 ]]; then
            echo "::error::Not requested, branch already exists: ${stuck[*]}"
            exit 1
          fi
