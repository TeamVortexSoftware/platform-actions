$schema: https://assets.vortexsoftware.dev/schemas/json/repo/LintFile.json

# How the platform's lint checks are tuned for this repo. Installed by the repo
# profile with the platform's defaults; the values here are this repo's own and
# are never overwritten by an update. A comment beside a value is where you say
# why it is what it is.

# The terraform rules (`vortex tfm lint`), for a repo with terraform to check:
# `rulesets` defines named sets of settings, `paths` points directories at them.
# How it fits together:
# https://github.com/TeamVortexSoftware/platform-repos/blob/main/docs/linting.md#configuring-the-terraform-rules
#
# tfm:
#   rulesets:
#     roots:
#       kind: root-modules
#       exclude:
#         - users/* # personal sandboxes; not held to the platform shape
#   paths:
#     state-groups: roots
