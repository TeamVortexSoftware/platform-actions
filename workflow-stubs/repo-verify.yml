# From the vortex 'repo-verify' workflow template. Install as vtx-repo-verify.yml.
# See platform-actions/docs/workflows/repo-verify.md
#
# MANAGED BY `vortex repo gha update`. Everything outside a `vtx:keep` block
# is refreshed from this template on every update — which is how a change here
# reaches every repo that installed it. Everything INSIDE a block is yours and is
# never touched. To stop the file being managed at all, rename it to drop the
# `vtx-` prefix; you keep a working workflow that is then entirely your own.

# vtx:requires vortex:lint:all vortex:test:all vortex:generate:all vortex:build:all
#
# Each is called with `pnpm run --if-present`, so a missing one does not fail the
# run — the job goes green having verified nothing. That is why the CLI says
# something when you install or update this stub, which is the only moment a
# person is watching.

# ------------------------------------------------------------ vtx:keep name ---
name: "[VTX] Repo Verify"
# ------------------------------------------------------------------ vtx:end ---

# TRIGGERS AND THE DRAFT GATE. Both halves are platform-owned and sit OUTSIDE
# every vtx:keep block, so a change to either reaches every repo on the next
# `vortex repo gha update`. The triggers used to be a `vtx:keep triggers` block
# whose own comment told you not to edit it — a block that means "yours" wrapped
# around content that never was.
#
# The gate is two halves that only work together: `ready_for_review` in the types
# below, and the `if:` on the verify job. Leave one half repo-editable and a repo
# can end up holding exactly one of them — an `if:` that skips drafts with no
# event to fire when the draft is marked ready, so the pull request never
# verifies at all. That is a worse failure than no gate, which is why neither
# half is yours to change.
#
# WHY EACH TYPE IS LISTED — the default three, plus one. Do not trim the list:
#
#   opened            a pull request appears. Skipped while it is a draft.
#   synchronize       a commit is pushed. THIS IS THE ONE PEOPLE DELETE as
#                     redundant. Without it a pull request that fails, gets fixed
#                     and is re-pushed never re-verifies, leaving a green tick on
#                     a tree that no longer exists.
#   reopened          a closed pull request comes back.
#   ready_for_review  a draft is marked ready. This is the run that matters: the
#                     first full verification of the finished tree. Without this
#                     type, marking a gated draft ready fires nothing at all.
#
# `workflow_dispatch` is for running verification against a branch on demand —
# re-checking after a shared-workflow change lands, or checking a branch that has
# no PR yet. GitHub only offers it in the UI once this file is on the default
# branch. The gate is written so a dispatched run is never skipped.
#
# A repo that genuinely needs a different trigger set has the escape hatch it
# always had: rename the file to drop the `vtx-` prefix and own it outright.

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

jobs:
    verify:
        # THE DRAFT GATE. A draft pull request does not verify. Iteration during
        # review is free, and the runners are spent once, on the tree the review
        # finished with — marking the pull request ready fires `ready_for_review`
        # and this condition lets that run through.
        #
        # A commit pushed to a READY pull request still verifies: `synchronize` is
        # in the types above and this condition does not exclude it. The gate buys
        # cheap iteration, never a way to merge something unverified.
        #
        # The `github.event_name` half is not redundant. A `workflow_dispatch` run
        # carries no pull_request payload, so `github.event.pull_request.draft` is
        # null there — and whether `null == false` holds is a coercion rule nobody
        # should have to look up to know that dispatching still works. Say it.
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

        # `uses:` cannot take an expression, so this one org is a literal.
        uses: TeamVortexSoftware/platform-actions/.github/workflows/repo-verify.yml@main

        # =====================================================================
        # SETTINGS — what each one does, and the value you get if you leave it
        # out. This list is refreshed on every `vortex repo gha update`, so it
        # always describes the workflow you are actually calling. Your chosen
        # values live in the block below it and are never overwritten.
        #
        # Four jobs run against your repo, each running the matching
        # `vortex:<name>:all` script from your package.json. There is one setting
        # per job, named to match. Set it to true and that job does not run.
        #
        #   skip-lint            default false
        #       Runs `vortex:lint:all`.
        #
        #   skip-test            default false
        #       Runs `vortex:test:all`, then fails if the run left any file
        #       changed. A test battery is supposed to leave no trace — write to
        #       a temp directory, or add the output to .gitignore.
        #
        #   skip-generate        default false
        #       Runs `vortex:generate:all`, then fails if any file changed. That
        #       catches the case where someone edited a source file and forgot to
        #       re-run the generator. Skip it only while adopting this workflow in
        #       a repo whose generators are not yet trustworthy — it is meant to
        #       go back to false.
        #
        #   skip-build           default TRUE
        #       Runs `vortex:build:all`, then fails if any file changed. Build
        #       output is never committed, so anything left behind means
        #       something is missing from .gitignore. This is the one job not
        #       worth running everywhere, which is why it is the one skipped by
        #       default. Turn it on where a PR should prove the thing still
        #       builds; leave it off in a repo that does not build anything.
        #
        #   node-version         default ""
        #       Empty means "read it from this repo's .nvmrc", which is what you
        #       almost certainly want. Put a version string here to override that.
        #
        #   submodules           default "recursive"
        #       What to check out alongside your repo. "recursive" also gets
        #       submodules, and submodules inside those. Use "false" for a faster
        #       checkout in a repo with no submodules; "true" gets the top level
        #       of submodules only.
        # =====================================================================

        # -------------------------------------------------- vtx:keep inputs ---
        with:
            skip-lint: false
            skip-test: false
            skip-generate: false
            skip-build: true
            node-version: ""
            submodules: "recursive"
        # ---------------------------------------------------------- vtx:end ---

        # =====================================================================
        # SECRETS — both are organization-level, so they already exist for every
        # repo and you do not have to create them. Passing one your repo does not
        # need is harmless.
        #
        #   ssh-key
        #       Needed if your repo has submodules. Our .gitmodules files use SSH
        #       addresses, and the token GitHub hands a workflow by default
        #       cannot read those, so checkout needs this key instead.
        #
        #   npm-token
        #       Needed if your repo installs any @teamvortexsoftware package, and
        #       whenever the vortex CLI itself has to be fetched — which happens
        #       automatically when the repo does not carry it as a dependency.
        #
        #       Note the name: NPM_READ_TOKEN, not NPM_TOKEN. NPM_READ_TOKEN is
        #       the organization-level one that every repo has. NPM_TOKEN exists
        #       only on two repos, so naming it here would quietly resolve to
        #       nothing everywhere else — and npm answers an unauthenticated
        #       request for a private package with "not found" rather than "not
        #       allowed", so the failure would look like a missing package rather
        #       than a missing credential.
        # =====================================================================

        # ------------------------------------------------- vtx:keep secrets ---
        secrets:
            ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
            npm-token: ${{ secrets.NPM_READ_TOKEN }}
        # ---------------------------------------------------------- vtx:end ---

####   Your own jobs and edits go INSIDE the block below.  ####
####   Anything outside it is replaced on the next update.  ####

# ----------------------------------------------------------- vtx:keep extra ---
# ------------------------------------------------------------------ vtx:end ---
